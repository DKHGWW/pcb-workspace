<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理系统 - 前后台连接示例</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== 顶部导航栏 ====== -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">
        <span class="logo-icon">📋</span>
        <span>任务管理系统</span>
      </div>
      <div class="nav-right">
        <button class="btn btn-refresh" onclick="loadTasks()">
          <span>🔄</span> 刷新
        </button>
      </div>
    </div>
  </header>

  <!-- ====== 主内容区 ====== -->
  <main class="container">

    <!-- 统计卡片 -->
    <section class="stats-grid">
      <div class="stat-card stat-total">
        <div class="stat-icon">📊</div>
        <div class="stat-info">
          <span class="stat-label">总任务</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
      </div>
      <div class="stat-card stat-pending">
        <div class="stat-icon">⏳</div>
        <div class="stat-info">
          <span class="stat-label">待处理</span>
          <span class="stat-value" id="stat-pending">0</span>
        </div>
      </div>
      <div class="stat-card stat-completed">
        <div class="stat-icon">✅</div>
        <div class="stat-info">
          <span class="stat-label">已完成</span>
          <span class="stat-value" id="stat-completed">0</span>
        </div>
      </div>
    </section>

    <!-- 新建任务表单 -->
    <section class="card">
      <h2 class="card-title">➕ 新建任务</h2>
      <form id="task-form" onsubmit="createTask(event)">
        <div class="form-row">
          <input
            type="text"
            id="task-title"
            placeholder="输入任务标题..."
            class="input"
            required
          />
          <button type="submit" class="btn btn-primary">添加任务</button>
        </div>
        <textarea
          id="task-desc"
          placeholder="任务描述（可选）..."
          class="input textarea"
          rows="2"
        ></textarea>
      </form>
    </section>

    <!-- 任务筛选 -->
    <section class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="filterTasks('all')">全部</button>
      <button class="filter-btn" data-filter="pending" onclick="filterTasks('pending')">待处理</button>
      <button class="filter-btn" data-filter="in_progress" onclick="filterTasks('in_progress')">进行中</button>
      <button class="filter-btn" data-filter="completed" onclick="filterTasks('completed')">已完成</button>
    </section>

    <!-- 任务列表 -->
    <section class="task-list" id="task-list">
      <!-- 任务卡片由 JS 动态渲染 -->
      <div class="loading">加载中...</div>
    </section>

  </main>

  <!-- ====== 编辑模态框 ====== -->
  <div class="modal-overlay" id="edit-modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>✏️ 编辑任务</h3>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="edit-title" class="input" />
        </div>
        <div class="form-group">
          <label>描述</label>
          <textarea id="edit-desc" class="input textarea" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>状态</label>
          <select id="edit-status" class="input">
            <option value="pending">待处理</option>
            <option value="in_progress">进行中</option>
            <option value="completed">已完成</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="updateTask()">保存修改</button>
      </div>
    </div>
  </div>

  <!-- 消息提示 -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
